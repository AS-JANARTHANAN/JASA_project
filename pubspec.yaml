name: JASA
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase Flutter SDK (for database, auth, storage, etc.)
  supabase_flutter: ^2.10.0
  supabase: ^2.9.0

  # Cupertino icons for iOS-style icons
  cupertino_icons: ^1.0.8

  # Image picker for uploading product images
  image_picker: ^1.1.2

  # Path provider for local file storage
  path_provider: ^2.1.5

  # Intl for date/time formatting (useful for bills & history)
  intl: ^0.19.0

  # ✅ For compressing product images before upload
  flutter_image_compress: ^2.3.0

  # ✅ For generating unique product IDs
  uuid: ^4.4.0

  # PDF generation and printing
  pdf: ^3.10.8
  printing: ^5.11.1

  # ✅ Local caching for offline-first experience
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ✅ Image caching for fast loading
  cached_network_image: ^3.4.1

  # ✅ Network connectivity monitoring
  connectivity_plus: ^6.1.0

  # ✅ HTTP client for image downloads
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Add assets here later (example images, logos, etc.)
  # assets:
  #   - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
